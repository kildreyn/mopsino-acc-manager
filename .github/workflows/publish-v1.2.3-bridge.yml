name: Publish v1.2.3 compatibility bridge

on:
  push:
    branches:
      - main
    paths:
      - ".github/bridge-v1.2.3-trigger.txt"

permissions:
  contents: write

jobs:
  publish:
    name: Mirror v1.2.3 updater assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download v1.2.3 updater assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bridge-assets
          gh release download v1.2.3 \
            --repo kildreyn/mopsino-account-manager \
            --dir bridge-assets \
            --pattern "latest.yml" \
            --pattern "MopsinoAccountManager-Setup-1.2.3.exe" \
            --pattern "MopsinoAccountManager-Setup-1.2.3.exe.blockmap"
          ls -lah bridge-assets

      - name: Publish compatibility release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.2.3 --repo kildreyn/mopsino-acc-manager >/dev/null 2>&1; then
            gh release upload v1.2.3 bridge-assets/* \
              --repo kildreyn/mopsino-acc-manager \
              --clobber
          else
            gh release create v1.2.3 bridge-assets/* \
              --repo kildreyn/mopsino-acc-manager \
              --target main \
              --title "Mopsino Account Manager 1.2.3" \
              --notes "Compatibility bridge for Mopsino Account Manager 1.2.2. Existing 1.2.2 installations can discover and install 1.2.3 automatically. From 1.2.3 onward updates use the main public updater repository."
          fi

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.2.3 \
            --repo kildreyn/mopsino-acc-manager \
            --json tagName,isDraft,isPrerelease,assets
